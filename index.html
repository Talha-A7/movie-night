<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Night</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #14111a; --panel: #1f1a28; --panel2: #2a2336; --text: #f3eef8;
    --muted: #a89fb5; --accent: #ff6b9a; --accent2: #ffb36b; --ok: #6bdc9a; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--panel2); }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--accent); }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
    background: var(--panel2); color: var(--text); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1a0f14; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--panel2);
    background: var(--panel); color: var(--text); min-width: 0; }
  .hidden { display: none !important; }

  /* Lobby */
  #lobby { max-width: 720px; margin: 48px auto; padding: 0 16px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  .card { background: var(--panel); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) { #lobby { grid-template-columns: 1fr; margin-top: 24px; } }

  /* Room */
  #room { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 59px); }
  @media (max-width: 900px) { #room { grid-template-columns: 1fr; height: auto; } #chat { height: 50vh; } }
  #stage { position: relative; background: #000; display: flex; align-items: center; justify-content: center; min-height: 300px; }
  #stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #placeholder { position: absolute; text-align: center; color: var(--muted); padding: 20px; }
  #placeholder .big { font-size: 48px; }
  #toolbar { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; opacity: 0; transition: opacity .2s; }
  #stage:hover #toolbar, #toolbar:focus-within { opacity: 1; }
  #toolbar .spacer { flex: 1; }
  #toolbar button { background: rgba(30,25,40,.85); backdrop-filter: blur(6px); }
  #toolbar button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  #volume { width: 110px; accent-color: var(--accent); }
  #codebox { position: absolute; top: 12px; left: 12px; background: rgba(30,25,40,.85); padding: 8px 12px;
    border-radius: 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  #codebox b { font-size: 16px; letter-spacing: 2px; color: var(--accent2); }
  #codebox button { padding: 4px 10px; font-size: 12px; }
  #tapToPlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  #floaties { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .floaty { position: absolute; bottom: 60px; font-size: 40px; animation: floatUp 2.8s ease-out forwards; }
  @keyframes floatUp { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-60vh) scale(1.3); opacity: 0; } }

  /* Playback controls */
  #controls { position: absolute; left: 12px; right: 12px; bottom: 62px; display: flex; gap: 10px; align-items: center;
    background: rgba(30,25,40,.85); backdrop-filter: blur(6px); border-radius: 12px; padding: 6px 12px;
    opacity: 0; transition: opacity .2s; }
  #stage:hover #controls, #controls:focus-within, #controls.show { opacity: 1; }
  #controls button { background: transparent; padding: 6px 8px; font-size: 18px; min-width: 40px; }
  #controls button:hover { background: var(--panel2); }
  #seek { flex: 1; min-width: 0; accent-color: var(--accent); }
  #timeText { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

  /* Chat */
  #chat { background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid var(--panel2); min-height: 0; }
  #chat h3 { margin: 0; padding: 14px 16px; font-size: 15px; border-bottom: 1px solid var(--panel2); }
  #messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--panel2); word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1a0f14; }
  .msg small { display: block; font-size: 11px; opacity: .7; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  #reactions { display: flex; gap: 4px; padding: 8px 12px 0; }
  #reactions button { padding: 6px 8px; font-size: 18px; background: transparent; }
  #reactions button:hover { background: var(--panel2); }
  #chatForm { display: flex; gap: 8px; padding: 12px; }
  #chatInput { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🍿 Movie <span>Night</span></h1>
  <div id="status">Not connected</div>
</header>

<section id="lobby">
  <div class="card">
    <h2>🎬 Host a movie</h2>
    <p>You share your screen and the movie's sound. You'll get a code to send to your partner.</p>
    <input id="hostName" placeholder="Your name" maxlength="20">
    <button class="primary" id="hostBtn">Create room</button>
  </div>
  <div class="card">
    <h2>💌 Join a room</h2>
    <p>Type in the code your partner sent you.</p>
    <input id="joinName" placeholder="Your name" maxlength="20">
    <input id="joinCode" placeholder="Room code (e.g. 4K7Q9)" maxlength="8" style="text-transform:uppercase">
    <button class="primary" id="joinBtn">Join</button>
  </div>
</section>

<section id="room" class="hidden">
  <div id="stage">
    <video id="video" playsinline autoplay></video>
    <div id="placeholder"><div class="big">🎞️</div><div id="placeholderText">Waiting…</div></div>
    <div id="floaties"></div>
    <div id="codebox" class="hidden">Room code: <b id="codeText"></b><button id="copyBtn">Copy</button></div>
    <div id="tapToPlay" class="hidden"><button class="primary" id="tapBtn">▶ Click to start watching</button></div>
    <div id="controls" class="hidden">
      <button id="backBtn" title="Back 10s">⏪</button>
      <button id="playBtn" title="Play / pause (space)">▶</button>
      <button id="fwdBtn" title="Forward 10s">⏩</button>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0">
      <span id="timeText">0:00 / 0:00</span>
    </div>
    <div id="toolbar">
      <button class="primary hidden" id="fileBtn">🎞️ Open movie file</button>
      <button class="hidden" id="shareBtn">🖥️ Share screen</button>
      <button class="hidden" id="stopBtn">⏹ Stop</button>
      <input type="file" id="fileInput" accept="video/*,.mkv" hidden>
      <span class="spacer"></span>
      <span class="viewerOnly hidden">🔊</span><input type="range" id="volume" class="viewerOnly hidden" min="0" max="1" step="0.01" value="1">
      <button id="fsBtn">⛶ Fullscreen</button>
    </div>
  </div>
  <aside id="chat">
    <h3>💬 Chat</h3>
    <div id="messages"></div>
    <div id="reactions">
      <button data-r="❤️">❤️</button><button data-r="😂">😂</button><button data-r="😱">😱</button>
      <button data-r="😭">😭</button><button data-r="🍿">🍿</button><button data-r="😘">😘</button>
    </div>
    <form id="chatForm"><input id="chatInput" placeholder="Say something…" autocomplete="off"><button class="primary">Send</button></form>
  </aside>
</section>

<script>
const $ = id => document.getElementById(id);
const PREFIX = 'movienight-v1-';
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:global.stun.twilio.com:3478' },
]};

// ---- Relay (TURN) server ----
// Needed when your networks block direct connections (stuck on "Connecting…").
// Free: sign up at https://dashboard.metered.ca → create an app → copy its name + API key here.
const METERED_APP = '';      // e.g. 'movienight'  (the part before .metered.live)
const METERED_API_KEY = '';
let hasTurn = false;
async function getIceConfig() {
  if (METERED_APP && METERED_API_KEY) {
    try {
      const r = await fetch(`https://${METERED_APP}.metered.live/api/v1/turn/credentials?apiKey=${METERED_API_KEY}`);
      const servers = await r.json();
      if (Array.isArray(servers) && servers.length) { hasTurn = true; return { iceServers: [...ICE.iceServers, ...servers] }; }
    } catch (e) { console.warn('TURN credentials fetch failed', e); }
  }
  return ICE;
}
const NO_RELAY_HELP = 'Your two networks block direct connections, so a relay (TURN) server is needed — see METERED_API_KEY in index.html.';
// Watch a connection's network path and report failures
function watchIce(pc, onFail) {
  if (!pc) return;
  pc.addEventListener('iceconnectionstatechange', () => {
    console.log('ICE state:', pc.iceConnectionState);
    if (pc.iceConnectionState === 'failed') onFail();
  });
}
function keepAlive(p) {
  p.on('disconnected', () => { if (!p.destroyed) { console.log('Lost room server, reconnecting…'); p.reconnect(); } });
}

let peer, isHost = false, myName = 'Me', stream = null;
const conns = new Map();   // peerId -> DataConnection
const calls = new Map();   // peerId -> MediaConnection (host side)

// remember names
try { $('hostName').value = $('joinName').value = localStorage.getItem('mn-name') || ''; } catch {}
const params = new URLSearchParams(location.search);
if (params.get('room')) $('joinCode').value = params.get('room');

function setStatus(text, cls = '') { $('status').textContent = text; $('status').className = cls; }
function saveName(n) { try { localStorage.setItem('mn-name', n); } catch {} }
function code() { const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; return Array.from({length: 5}, () => c[Math.floor(Math.random() * c.length)]).join(''); }

function enterRoom() { $('lobby').classList.add('hidden'); $('room').classList.remove('hidden'); }

// ---------- chat ----------
function addMsg(from, text, me) {
  const d = document.createElement('div');
  d.className = 'msg' + (me ? ' me' : '');
  const s = document.createElement('small'); s.textContent = from;
  d.append(s, document.createTextNode(text));
  $('messages').append(d); $('messages').scrollTop = 1e9;
}
function sysMsg(text) {
  const d = document.createElement('div'); d.className = 'sys'; d.textContent = text;
  $('messages').append(d); $('messages').scrollTop = 1e9;
}
function floaty(r) {
  const f = document.createElement('div'); f.className = 'floaty'; f.textContent = r;
  f.style.left = (10 + Math.random() * 80) + '%';
  $('floaties').append(f); setTimeout(() => f.remove(), 2900);
}
function broadcast(msg, except) { for (const [id, c] of conns) if (id !== except && c.open) c.send(msg); }
function handleData(msg, fromId) {
  if (msg.type === 'chat') addMsg(msg.from, msg.text, false);
  if (msg.type === 'react') floaty(msg.r);
  if (msg.type === 'sys') sysMsg(msg.text);
  if (msg.type === 'hello') { sysMsg(`${msg.from} joined 💕`); if (isHost) sendState(); }
  if (msg.type === 'stopped') { $('controls').classList.add('hidden'); showPlaceholder('The host stopped sharing. Waiting…'); }
  if (msg.type === 'state' && !isHost) {
    $('controls').classList.toggle('hidden', msg.mode !== 'file');
    if (msg.mode === 'file') renderControls(msg.paused, msg.t, msg.dur);
  }
  if (msg.type === 'ctrl' && isHost) { doCtrl(msg.action, msg.t, msg.from); return; }
  if (isHost && fromId && ['chat', 'react', 'hello'].includes(msg.type)) broadcast(msg, fromId); // relay to other viewers
}
$('chatForm').onsubmit = e => {
  e.preventDefault();
  const text = $('chatInput').value.trim(); if (!text) return;
  $('chatInput').value = '';
  addMsg(myName, text, true);
  broadcast({ type: 'chat', from: myName, text });
};
$('reactions').onclick = e => {
  const r = e.target.closest('button')?.dataset.r; if (!r) return;
  floaty(r); broadcast({ type: 'react', r });
};

// ---------- video ----------
function showPlaceholder(t) { $('placeholder').classList.remove('hidden'); $('placeholderText').textContent = t; }
function showVideo(s, muted) {
  const v = $('video'); v.srcObject = s; v.muted = muted;
  $('placeholder').classList.add('hidden');
  v.play().catch(() => $('tapToPlay').classList.remove('hidden'));
}
$('tapBtn').onclick = () => { $('video').play(); $('tapToPlay').classList.add('hidden'); };
$('volume').oninput = e => { $('video').volume = e.target.value; };
$('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen();

// ---------- shared playback controls (movie-file mode) ----------
let mode = null;            // host: null | 'file' | 'screen'
let seeking = false, lastStateSent = 0, currentUrl = null, recallTimer;
const fmt = s => {
  s = Math.max(0, Math.floor(+s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
};
function renderControls(paused, t, dur) {
  $('playBtn').textContent = paused ? '▶' : '⏸';
  $('controls').classList.toggle('show', !!paused);
  if (!seeking) { $('seek').max = dur || 0; $('seek').value = t || 0; }
  $('timeText').textContent = `${fmt(seeking ? $('seek').value : t)} / ${fmt(dur)}`;
}
function sendState() {
  const v = $('video');
  broadcast(mode === 'file'
    ? { type: 'state', mode, paused: v.paused, t: v.currentTime, dur: v.duration || 0 }
    : { type: 'state', mode });
  lastStateSent = Date.now();
}
// Pressed locally: host acts directly, viewer asks the host
function control(action, t) {
  if (isHost) return doCtrl(action, t, myName);
  const c = [...conns.values()][0];
  if (c?.open) c.send({ type: 'ctrl', action, t, from: myName });
}
function announce(text) { sysMsg(text); broadcast({ type: 'sys', text }); }
function doCtrl(action, t, who) {
  const v = $('video');
  if (mode !== 'file') return;
  if (action === 'toggle') {
    if (v.paused) { v.play(); announce(`${who} pressed play ▶`); }
    else { v.pause(); announce(`${who} paused ⏸`); }
  } else if (action === 'seek' || action === 'skip') {
    const to = Math.max(0, Math.min(action === 'skip' ? v.currentTime + t : t, v.duration || Infinity));
    v.currentTime = to;
    announce(`${who} jumped to ${fmt(to)}`);
  }
}
$('playBtn').onclick = () => control('toggle');
$('backBtn').onclick = () => control('skip', -10);
$('fwdBtn').onclick = () => control('skip', 10);
$('seek').oninput = () => { seeking = true; $('timeText').textContent = `${fmt($('seek').value)} / ${fmt($('seek').max)}`; };
$('seek').onchange = () => { seeking = false; control('seek', +$('seek').value); };
document.addEventListener('keydown', e => {
  if ($('controls').classList.contains('hidden') || e.target.matches('input:not([type=range]), textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); control('toggle'); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); control('skip', -10); }
  if (e.code === 'ArrowRight') { e.preventDefault(); control('skip', 10); }
});

// Host: keep the UI and the viewers in sync with the real video element
const hv = $('video');
['play', 'pause', 'seeked', 'loadedmetadata'].forEach(ev => hv.addEventListener(ev, () => {
  if (!isHost || mode !== 'file') return;
  renderControls(hv.paused, hv.currentTime, hv.duration); sendState();
}));
hv.addEventListener('timeupdate', () => {
  if (!isHost || mode !== 'file') return;
  renderControls(hv.paused, hv.currentTime, hv.duration);
  if (Date.now() - lastStateSent > 1000) sendState();
});
hv.addEventListener('error', () => {
  if (isHost && mode === 'file') sysMsg("⚠️ Chrome can't play this file. MP4 (H.264 + AAC) or WebM works best — some MKVs won't play.");
});

// Push higher bitrate so movies look sharp
function tuneSender(pc) {
  if (!pc) return;
  const apply = () => {
    for (const sender of pc.getSenders()) {
      if (sender.track?.kind !== 'video') continue;
      const p = sender.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = 8_000_000;
      p.encodings[0].maxFramerate = 30;
      p.degradationPreference = 'maintain-framerate';
      sender.setParameters(p).catch(() => {});
    }
  };
  pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'connected') apply(); });
}

// ---------- HOST ----------
$('hostBtn').onclick = async () => {
  myName = $('hostName').value.trim() || 'Host'; saveName(myName);
  isHost = true;
  const roomCode = code();
  setStatus('Creating room…');
  peer = new Peer(PREFIX + roomCode, { config: await getIceConfig() });
  keepAlive(peer);
  peer.on('open', () => {
    enterRoom();
    setStatus('Room open — waiting for your partner', 'ok');
    $('codeText').textContent = roomCode; $('codebox').classList.remove('hidden');
    $('shareBtn').classList.remove('hidden'); $('fileBtn').classList.remove('hidden');
    showPlaceholder('Hover here and click "Open movie file" to play a movie you both can pause and seek — or "Share screen" to share anything else.');
    sysMsg(`Room ${roomCode} created. Send the code to your partner!`);
  });
  peer.on('connection', conn => {
    sysMsg('Someone is connecting…');
    watchIce(conn.peerConnection, () => sysMsg('❌ Connection to your partner failed. ' + (hasTurn ? 'Try again in a moment.' : NO_RELAY_HELP)));
    conn.on('open', () => {
      conns.set(conn.peer, conn);
      setStatus(`Connected (${conns.size} watching)`, 'ok');
      if (stream?.getTracks().length) callViewer(conn.peer);
      sendState();
    });
    conn.on('data', m => handleData(m, conn.peer));
    conn.on('close', () => {
      conns.delete(conn.peer); calls.get(conn.peer)?.close(); calls.delete(conn.peer);
      sysMsg('Your partner left'); setStatus(conns.size ? `Connected (${conns.size} watching)` : 'Waiting for your partner', 'ok');
    });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); $('hostBtn').click(); return; } // code collision, retry
    setStatus('Error: ' + err.type, 'err'); console.error(err);
  });
};

$('copyBtn').onclick = () => {
  const url = location.protocol.startsWith('http') ? `${location.origin}${location.pathname}?room=${$('codeText').textContent}` : $('codeText').textContent;
  navigator.clipboard.writeText(url).then(() => { $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1500); });
};

function callViewer(id) {
  calls.get(id)?.close();
  const call = peer.call(id, stream);
  tuneSender(call.peerConnection);
  calls.set(id, call);
}

// ---------- HOST: play a movie file inside the page ----------
function callAll() {
  if (!stream?.getTracks().length) return;
  for (const id of conns.keys()) callViewer(id);
}
$('fileBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = () => {
  const f = $('fileInput').files[0]; $('fileInput').value = '';
  if (!f) return;
  stopShare(true);
  const v = $('video');
  mode = 'file';
  v.srcObject = null; v.muted = false;
  v.src = currentUrl = URL.createObjectURL(f);
  $('placeholder').classList.add('hidden'); $('controls').classList.remove('hidden'); $('stopBtn').classList.remove('hidden');
  v.addEventListener('loadedmetadata', () => {
    stream = v.captureStream ? v.captureStream() : v.mozCaptureStream();
    // tracks can appear a moment later — (re)send to viewers once they do
    stream.onaddtrack = () => { clearTimeout(recallTimer); recallTimer = setTimeout(callAll, 400); };
    callAll(); sendState();
  }, { once: true });
  announce(`${myName} loaded “${f.name}” 🎬 — press ▶ when you're both ready!`);
};

// ---------- HOST: share screen ----------
$('shareBtn').onclick = async () => {
  let s;
  try {
    s = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 30 }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 },
      systemAudio: 'include', selfBrowserSurface: 'exclude', surfaceSwitching: 'include',
    });
  } catch (e) { sysMsg('Screen share was cancelled.'); return; }
  stopShare(true);
  stream = s; mode = 'screen';
  const vt = stream.getVideoTracks()[0];
  if (vt && 'contentHint' in vt) vt.contentHint = 'motion';
  if (!stream.getAudioTracks().length) sysMsg('⚠️ No audio is being shared! Stop and share again, and tick "Share tab audio" / "Share system audio".');
  vt.onended = () => { if (stream === s) stopShare(); };
  showVideo(stream, true); // host preview is muted so audio doesn't double up
  $('stopBtn').classList.remove('hidden');
  callAll(); sendState();
  broadcast({ type: 'sys', text: `${myName} started sharing 🎬` }); sysMsg('You are sharing 🎬');
};

// Stops whatever is playing. silent = switching sources, don't tell viewers it ended.
function stopShare(silent) {
  const v = $('video');
  mode = null;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  for (const c of calls.values()) c.close(); calls.clear();
  v.pause(); v.srcObject = null; v.removeAttribute('src'); v.load();
  if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
  $('controls').classList.add('hidden'); $('stopBtn').classList.add('hidden');
  if (silent === true) return;
  showPlaceholder('Nothing playing. Open a movie file or share your screen.');
  broadcast({ type: 'stopped' });
}
$('stopBtn').onclick = () => stopShare();

// ---------- VIEWER ----------
$('joinBtn').onclick = async () => {
  myName = $('joinName').value.trim() || 'Guest'; saveName(myName);
  const roomCode = $('joinCode').value.trim().toUpperCase();
  if (!roomCode) { $('joinCode').focus(); return; }
  $('joinBtn').disabled = true;
  setStatus('Reaching the room server…');
  peer?.destroy();
  peer = new Peer({ config: await getIceConfig() });
  keepAlive(peer);
  let opened = false;
  const fail = text => {
    if (opened) return;
    setStatus(text, 'err'); $('joinBtn').disabled = false;
    peer.destroy();
  };
  const timer = setTimeout(() => fail('Could not connect after 25s. ' + (hasTurn ? 'Check the code, and that the host still has the room open.' : NO_RELAY_HELP)), 25000);
  peer.on('open', () => {
    setStatus('Found the room server — connecting to your partner…');
    const conn = peer.connect(PREFIX + roomCode, { reliable: true });
    watchIce(conn.peerConnection, () => { clearTimeout(timer); fail('Connection failed. ' + (hasTurn ? 'Try again.' : NO_RELAY_HELP)); });
    conn.on('open', () => {
      opened = true; clearTimeout(timer); $('joinBtn').disabled = false;
      conns.set(conn.peer, conn);
      enterRoom();
      document.querySelectorAll('.viewerOnly').forEach(el => el.classList.remove('hidden'));
      setStatus('Connected 💕', 'ok');
      showPlaceholder('Connected! Waiting for the host to share their screen…');
      conn.send({ type: 'hello', from: myName });
    });
    conn.on('data', m => handleData(m));
    conn.on('close', () => { setStatus('Host disconnected', 'err'); showPlaceholder('The host left the room.'); });
  });
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => showVideo(s, false));
  });
  peer.on('error', err => {
    console.error(err);
    if (opened) return setStatus('Error: ' + err.type, 'err');
    clearTimeout(timer);
    fail(err.type === 'peer-unavailable' ? 'No room with that code. Check the code and that the host\'s page is still open.' : 'Error: ' + err.type);
  });
};
</script>
</body>
</html>
